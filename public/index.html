<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stranger Connect App</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        #status { font-weight: bold; margin-bottom: 10px; padding: 10px; border: 1px solid #ccc; background-color: #f9f9f9; }
        #messages { height: 300px; border: 1px solid #eee; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .user-message { color: blue; }
        .stranger-message { color: green; }
    </style>
</head>
<body>

    <h1>Stranger Connect</h1>

    <div id="status">Connecting...</div>

    <div id="messages"></div>

    <input type="text" id="messageInput" placeholder="Type a message..." disabled style="width: 80%;">
    <button onclick="sendMessage()" id="sendButton" disabled>Send</button>

    <div style="margin-top: 20px;">
        <button onclick="connectStranger()" id="connectButton">Connect/Reconnect</button>
        <button onclick="disconnectStranger()" id="disconnectButton" disabled>Disconnect</button>
    </div>

    <script>
        // 🔑 RENDER FIX: Determine protocol based on the current page's protocol
        // If the page is loaded via HTTPS (Render), use WSS (Secure WebSocket).
        // Otherwise (localhost), use WS (Insecure WebSocket).
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        const host = window.location.host;
        const websocketUrl = `${protocol}://${host}`; 
        
        let socket = null;

        const statusElement = document.getElementById('status');
        const messagesElement = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const connectButton = document.getElementById('connectButton');
        const disconnectButton = document.getElementById('disconnectButton');

        function logMessage(text, className = '') {
            const msgDiv = document.createElement('div');
            msgDiv.textContent = text;
            if (className) {
                msgDiv.classList.add(className);
            }
            messagesElement.appendChild(msgDiv);
            messagesElement.scrollTop = messagesElement.scrollHeight; // Auto-scroll
        }

        function setControls(isConnected) {
            messageInput.disabled = !isConnected;
            sendButton.disabled = !isConnected;
            disconnectButton.disabled = !isConnected;
            // The connect/reconnect button is always enabled for easy connection management
            // connectButton.disabled = isConnected; 
        }

        function connectStranger() {
            if (socket) {
                // Manually close any existing connection before starting a new one
                socket.close(); 
            }

            statusElement.textContent = 'Connecting...';
            messagesElement.innerHTML = '';
            setControls(false);

            socket = new WebSocket(websocketUrl); // Uses the fixed, dynamic URL

            socket.onopen = () => {
                logMessage("Connection to server established.", 'system-message');
                // The server will handle the pairing logic
                // We send a CONNECT signal just in case, but the pairing starts on server connection.
                socket.send(JSON.stringify({ type: 'CONNECT' })); 
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);

                switch (data.type) {
                    case 'STATUS':
                        statusElement.textContent = data.message;
                        logMessage(`[SYSTEM] ${data.message}`, 'system-message');
                        if (data.message.includes('Connected')) {
                            setControls(true);
                        } else {
                            setControls(false);
                        }
                        break;
                    case 'DISCONNECTED':
                        statusElement.textContent = data.message;
                        logMessage(`[SYSTEM] ${data.message}`, 'system-message');
                        setControls(false);
                        // The server will automatically attempt to find a new stranger
                        break;
                    case 'CHAT':
                        logMessage(`Stranger: ${data.message}`, 'stranger-message');
                        break;
                }
            };

            socket.onclose = () => {
                statusElement.textContent = 'Disconnected from server.';
                logMessage("[SYSTEM] Server connection closed. Click Connect/Reconnect to try again.", 'system-message');
                setControls(false);
            };

            socket.onerror = (error) => {
                console.error("WebSocket Error:", error);
                statusElement.textContent = 'Connection Error. See console.';
            };
        }

        function disconnectStranger() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                // Send a signal to the server to disconnect from the current partner
                socket.send(JSON.stringify({ type: 'DISCONNECT' }));
            }
            // The server will handle the pairing of the user with a new stranger
        }

        function sendMessage() {
            const message = messageInput.value.trim();
            if (message && socket && socket.readyState === WebSocket.OPEN) {
                // Send chat message to the server
                socket.send(JSON.stringify({ type: 'CHAT', message: message }));
                // Display the message locally
                logMessage(`You: ${message}`, 'user-message');
                // Clear the input field
                messageInput.value = '';
            }
        }
        
        // Handle 'Enter' key press in the input field
        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !messageInput.disabled) {
                sendMessage();
            }
        });

        // Initial connection attempt on page load
        connectStranger();
    </script>
</body>
</html>
