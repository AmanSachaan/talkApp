<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stranger Connect Chat</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f4f4f9; }
        h1 { color: #333; text-align: center; }
        #status { font-weight: bold; margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; background-color: #e0f7fa; border-radius: 4px; text-align: center; }
        #messages { height: 300px; border: 1px solid #ddd; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background-color: white; border-radius: 4px; }
        .user-message { color: #007bff; margin: 5px 0; }
        .stranger-message { color: #28a745; margin: 5px 0; }
        .system-message { color: #6c757d; font-style: italic; margin: 5px 0; }
        .controls button { padding: 10px 15px; margin-right: 10px; border: none; border-radius: 4px; cursor: pointer; }
        #connectButton { background-color: #007bff; color: white; }
        #disconnectButton { background-color: #dc3545; color: white; }
        .input-area { display: flex; margin-bottom: 15px; }
        .input-area input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px 0 0 4px; }
        .input-area button { padding: 10px; background-color: #6c757d; color: white; border: none; border-radius: 0 4px 4px 0; }
        .input-area button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>Stranger Connect</h1>

    <div id="status">Welcome! Click Connect to find a stranger.</div>

    <div id="messages"></div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Type a message..." disabled>
        <button onclick="sendMessage()" id="sendButton" disabled>Send</button>
    </div>

    <div class="controls">
        <button onclick="connectStranger()" id="connectButton">Connect</button>
        <button onclick="disconnectStranger()" id="disconnectButton" disabled>Disconnect</button>
    </div>

    <script>
        // 🔑 RENDER FIX: Dynamically set the protocol (wss for production/Render, ws for local)
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        const host = window.location.host;
        const websocketUrl = `${protocol}://${host}`; 
        
        let socket = null;
        let isPaired = false; 

        const statusElement = document.getElementById('status');
        const messagesElement = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const disconnectButton = document.getElementById('disconnectButton');
        const connectButton = document.getElementById('connectButton');


        function logMessage(text, className = 'system-message') {
            const msgDiv = document.createElement('div');
            msgDiv.textContent = text;
            msgDiv.classList.add(className);
            messagesElement.appendChild(msgDiv);
            messagesElement.scrollTop = messagesElement.scrollHeight;
        }

        function setControls(pairedStatus, isConnecting = false) {
            isPaired = pairedStatus; // Update global state
            messageInput.disabled = !isPaired;
            sendButton.disabled = !isPaired;
            disconnectButton.disabled = !isPaired;
            
            connectButton.textContent = isPaired ? 'Find New Stranger' : 'Connect';
            connectButton.disabled = isConnecting; // Disable connect button while actively waiting
        }

        function connectStranger() {
            // Case 1: Socket is already open (user is waiting or paired and clicks 'Find New Stranger')
            if (socket && socket.readyState === WebSocket.OPEN) {
                if (!connectButton.disabled) { // Prevent double clicks
                    // Send the CONNECT signal to trigger pairing on the server
                    socket.send(JSON.stringify({ type: 'CONNECT' }));
                    statusElement.textContent = 'Looking for a stranger...';
                    logMessage("[SYSTEM] Searching for a new stranger...", 'system-message');
                    setControls(false, true); // Set to connecting/waiting state
                }
                return;
            }
            
            // Case 2: Socket is closed or null (initial connection)
            
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
                socket.close(); // Close any pending/stale connections
            }

            statusElement.textContent = 'Connecting to server...';
            logMessage("[SYSTEM] Starting server connection...", 'system-message');
            setControls(false, true); // Disable controls while connecting

            // Establish a fresh connection
            socket = new WebSocket(websocketUrl); 

            socket.onopen = () => {
                logMessage("Connection to server established. Requesting match.", 'system-message');
                // Send the CONNECT request as soon as the socket is open
                socket.send(JSON.stringify({ type: 'CONNECT' }));
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);

                switch (data.type) {
                    case 'STATUS':
                        statusElement.textContent = data.message;
                        logMessage(`[STATUS] ${data.message}`, 'system-message');
                        // Check if the message indicates a successful pairing
                        if (data.message.includes('Connected')) {
                            setControls(true, false); // Paired: enable chat, disable connect button
                        } else if (data.message.includes('Waiting')) {
                            setControls(false, true); // Waiting: disable chat, disable connect button
                        } else {
                            setControls(false, false); // Welcome/Disconnected: enable connect button
                        }
                        break;
                    case 'DISCONNECTED':
                        // The partner initiated the disconnection
                        statusElement.textContent = data.message;
                        logMessage(`[SYSTEM] ${data.message}`, 'system-message');
                        setControls(false, false); // No longer paired, allow user to click 'Connect'
                        break;
                    case 'CHAT':
                        logMessage(`Stranger: ${data.message}`, 'stranger-message');
                        break;
                }
            };

            socket.onclose = () => {
                statusElement.textContent = 'Disconnected from server.';
                logMessage("[SYSTEM] Server connection closed. Click Connect to try again.", 'system-message');
                setControls(false, false); // Allow user to click 'Connect'
            };

            socket.onerror = (error) => {
                console.error("WebSocket Error:", error);
                statusElement.textContent = 'Connection Error. See console.';
                logMessage("[ERROR] Could not connect. Check the browser console.", 'system-message');
                setControls(false, false);
            };
        }

        function disconnectStranger() {
            if (socket && isPaired) { 
                // Send a signal to the server to disconnect from the current partner
                socket.send(JSON.stringify({ type: 'DISCONNECT' }));
                
                // Set local state immediately to 'disconnected' status
                statusElement.textContent = 'You disconnected. Click Connect to find a new stranger.';
                logMessage("[SYSTEM] Disconnected from current stranger.", 'system-message');
                setControls(false, false); // No longer paired, enable Connect button
                messagesElement.value = ''; // Clear chat area for fresh start
            }
        }

        function sendMessage() {
            const message = messageInput.value.trim();
            if (message && socket && socket.readyState === WebSocket.OPEN && isPaired) {
                // Send chat message to the server
                socket.send(JSON.stringify({ type: 'CHAT', message: message }));
                // Display the message locally
                logMessage(`You: ${message}`, 'user-message');
                // Clear the input field
                messageInput.value = '';
            }
        }
        
        // Handle 'Enter' key press in the input field
        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !messageInput.disabled) {
                sendMessage();
            }
        });

        // 🔑 FIX: Initial UI state is set, no automatic connection
        setControls(false, false); // Not paired, Connect button enabled
    </script>
</body>
</html>
